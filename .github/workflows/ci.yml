name: CI

on:
  # Control: el despliegue solo se evalúa al hacer push a main
  push:
    branches: [main]
  # Control: todo PR hacia main se valida (lint + build) antes de poder integrarse
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        # Sin "version": la toma de "packageManager" (pnpm@11.17.0) en package.json
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: dist/

  deploy:
    name: Deploy AWS S3
    runs-on: ubuntu-latest

    # Control: el deploy depende de Build; si Build falla, Deploy no se ejecuta
    needs: build

    # Control: solo se despliega desde main y por push (nunca desde un PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: dist

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verificar identidad AWS
        run: aws sts get-caller-identity

      - name: Desplegar en Amazon S3
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET_NAME }}
